[Configuration]
AppFileName =.\FaultingApp.exe
AppParameters = 


[Logging]
LogViewLinesLimit =1000
LogFileName =BugFinder.log
SpoolToFile =1
LogFileRotation =0

StackDepth=5
PopUpOnErrors=1

SuppressBreakpointSourceDetails =1
SuppressDllEvents =0
SuppressOutputDebugStringEvents =0
SuppressProcessEvents =0
SuppressThreadEvents =0

[Breakpoints]
Delphi_BP_1=FaultingApp.exe,ufmFault,TfmFault.btCustDelphiExcClick
Delphi_BP_2=FaultingApp.exe,Controls,TControl.Click
VCpp_BP_3=FaultingAppCOFF.dll,FaultingAppCOFF.cpp,InternalRunException
VCpp_BP_4=FaultingAppCOFF.dll,FaultingAppCOFF.cpp,RaiseExceptionFromCoffDll
VCpp_BP_5=FaultingAppCOFF.dll,FaultingClass.cpp,CFaultingClass::Crash
Td32_BP_1=FaultingAppTD32.dll,FaultingAppTD32.dpr,RaiseExceptionFromTD32Dll

[ExceptionProviders]
Delphi_ExceptionProvider=DelphiEP.dll

[SymbolProviders]
Td32_SymbolsProvider=Td32SP.dll
MapFile_SymbolsProvider=MapSP.dll
Coff_CodeView_SymbolsProvider=CoffSP.dll
